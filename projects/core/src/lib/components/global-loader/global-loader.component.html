@if (loaderService.isLoading$ | async; as data) {
  @if (data && data.show) {
    <div class="loader" [ngClass]="{ 'system-loader': data.isSystemLoader, 'absolute': !data.isSystemLoader }"
      [style.--spinner-color]="color">
      <div class="loader-spinner"></div>
      <p class="loader-text">{{ 'shared.loading' | translate }}</p>
    </div>
  }
}
