@if (loaderService.isLoading$ | async; as data) {
  @if (data && data.show) {
    <div class="loader bg-{{color}}" [ngClass]="{
        'system-loader': data.isSystemLoader,
        'absolute': !data.isSystemLoader
      }">
      <div class="flex flex-col gap-5 items-center">
        <div class="animate-spin inline-block w-12 h-12 border-[3px] border-current border-t-transparent
          text-blue-900 rounded-full">
        </div>
        <span>{{ 'shared.loading' | translate }}</span>
      </div>
    </div>
  }
}
